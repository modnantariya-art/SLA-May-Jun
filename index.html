<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SLA Dashboard — ศูนย์กระจายสินค้า</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />
<style>
:root{
  --accent:#1f5fb0;
  --bg:#f8fafb;
  --surface:#ffffff;
  --surface-2:#f3f6f9;
  --surface-3:#eaeef3;
  --border:#dde3ea;
  --border-strong:#c4ccd6;
  --text:#2b3340;
  --muted:#6a737f;
  --faint:#9099a3;
  --pass:#15935f;
  --warn:#c1881a;
  --fail:#d23b34;
  --pass-bg:#e3f5ec;
  --warn-bg:#f8eed6;
  --fail-bg:#fbe6e3;
  --radius:12px;
  --radius-sm:8px;
  --shadow:0 1px 2px rgba(43,51,64,0.06),0 4px 16px rgba(43,51,64,0.05);
  --pad:22px;
  --font-th:"IBM Plex Sans Thai","IBM Plex Sans",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,monospace;
}
html[data-density="compact"]{--pad:15px;}
html[data-density="comfy"]{--pad:30px;}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:var(--font-th);background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;}
.tnum{font-variant-numeric:tabular-nums;font-feature-settings:"tnum";}
.muted{color:var(--muted);}
.status-text-pass{color:var(--pass);}
.status-text-warn{color:#a8740f;}
.status-text-fail{color:var(--fail);}

.app{min-height:100vh;display:flex;flex-direction:column;}
.content{flex:1;width:100%;max-width:1200px;margin:0 auto;padding:28px var(--pad) 56px;}

/* topbar */
.topbar{position:sticky;top:0;z-index:30;background:rgba(250,251,252,0.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);}
.topbar-inner{max-width:1200px;margin:0 auto;padding:14px var(--pad);display:flex;align-items:center;justify-content:space-between;gap:16px;}
.brand{display:flex;align-items:center;gap:12px;}
.brand-mark{width:42px;height:42px;border-radius:10px;background:var(--accent);color:#fff;font-family:var(--font-mono);font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.brand-title{font-weight:600;font-size:17px;letter-spacing:-.01em;white-space:nowrap;}
.brand-sub{font-size:12.5px;color:var(--muted);}
.topbar-right{display:flex;align-items:center;gap:16px;}
.period{text-align:right;display:flex;flex-direction:column;gap:1px;}
.period-label{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;}
.period-val{font-weight:600;font-size:15px;}
.period-arrow{color:var(--accent);margin:0 2px;}
.refresh-btn{appearance:none;border:1px solid var(--border-strong);background:var(--surface);color:var(--muted);font-family:inherit;font-size:12.5px;padding:7px 13px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap;transition:all .15s;}
.refresh-btn:hover{border-color:var(--accent);color:var(--accent);}
.refresh-btn:disabled{opacity:.5;cursor:default;}
.refresh-icon{font-size:14px;display:inline-block;}
.refresh-icon.spinning{animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.last-updated{font-size:11.5px;color:var(--faint);}
.data-date{font-size:11.5px;color:var(--muted);font-weight:500;}

/* tabs */
.tabs{max-width:1200px;margin:0 auto;padding:0 var(--pad);display:flex;gap:4px;}
.tab{appearance:none;border:none;background:none;cursor:pointer;font-family:inherit;padding:12px 18px 13px;display:flex;flex-direction:column;align-items:center;color:var(--muted);border-bottom:2.5px solid transparent;margin-bottom:-1px;transition:color .15s;}
.tab-th{font-weight:600;font-size:15px;white-space:nowrap;}
.tab:hover{color:var(--text);}
.tab-on{color:var(--accent);border-bottom-color:var(--accent);}

/* section head */
.section-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap;}
.section-title{font-size:21px;font-weight:600;margin:0 0 4px;letter-spacing:-.01em;}
.section-desc{margin:0;color:var(--muted);font-size:13.5px;max-width:60ch;}
.trend-legend{display:flex;gap:14px;align-items:center;flex-wrap:wrap;}

/* delta / trend */
.delta{display:inline-flex;align-items:center;gap:3px;font-variant-numeric:tabular-nums;font-weight:600;border-radius:6px;padding:2px 7px;}
.delta-arrow{font-size:.72em;}
.delta-up{color:var(--pass);background:var(--pass-bg);}
.delta-down{color:var(--fail);background:var(--fail-bg);}
.delta-flat{color:var(--muted);background:var(--surface-3);}
.delta-sm{font-size:12px;padding:1px 6px;}
.delta-md{font-size:13.5px;}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0;}
.dot-up{background:var(--pass);}
.dot-down{background:var(--fail);}
.dot-flat{background:var(--faint);}
.statusdot{display:inline-flex;align-items:center;gap:6px;}
.statusdot-label{font-size:12.5px;color:var(--muted);font-weight:500;white-space:nowrap;}
.legend-item{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;}

/* catmark */
.catmark{display:inline-flex;width:30px;height:30px;border-radius:8px;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;}
.catmark-total{background:var(--accent);color:#fff;}
.catmark-general{background:var(--surface-3);color:var(--text);}
.catmark-cold{background:#d8e8f6;color:#2a6aa8;}

/* overview rows */
.ov-rows{display:flex;flex-direction:column;gap:16px;}
.ovrow{display:grid;grid-template-columns:190px 1fr;gap:24px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px 26px;}
.ovrow-cat{display:flex;align-items:center;gap:12px;}
.ovrow-catname{font-weight:600;font-size:17px;white-space:nowrap;}
.ovrow-metrics{display:grid;grid-template-columns:1fr 1px 1fr;gap:32px;align-items:start;}
.ovrow-div{background:var(--border);align-self:stretch;}
.ovmetric{display:flex;flex-direction:column;gap:12px;}
.ovmetric-label{font-size:12.5px;color:var(--muted);font-weight:500;}
.ovmetric-main{display:flex;align-items:baseline;gap:14px;}
.ovmetric-val{font-size:40px;font-weight:600;letter-spacing:-.02em;line-height:1;}
.ovmetric-pct{font-size:.45em;font-weight:500;color:var(--muted);margin-left:2px;}
.prevref{font-size:13.5px;}

/* kpi cards */
.kpi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
.kpicard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;}
.kpicard-head{display:flex;align-items:center;gap:11px;padding:16px 18px;border-bottom:1px solid var(--border);}
.kpicard-title{font-weight:600;font-size:16px;}
.kpicard-body{padding:6px 18px 18px;}
.kpi-metric{padding:14px 0;}
.kpi-metric-label{font-size:12.5px;color:var(--muted);margin-bottom:8px;font-weight:500;}
.kpi-divider{height:1px;background:var(--border);}
.mblock-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:9px;}
.mblock-val{font-size:34px;font-weight:600;letter-spacing:-.02em;line-height:1;}
.mblock-pct{font-size:.5em;font-weight:500;color:var(--muted);margin-left:2px;}

/* split */
.split-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
.splitcol{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:6px 20px 14px;}
.splitcol-head{display:flex;align-items:baseline;gap:8px;padding:14px 0;border-bottom:1px solid var(--border);margin-bottom:6px;}
.splitcol-tag{font-weight:600;font-size:15px;}
.splitrow{padding:14px 0;border-bottom:1px solid var(--surface-3);}
.splitrow:last-child{border-bottom:none;}
.splitrow-cat{display:flex;align-items:center;gap:9px;font-weight:500;font-size:14px;margin-bottom:8px;}
.splitrow-val{display:flex;align-items:baseline;gap:10px;margin-bottom:9px;}
.splitrow-val .tnum{font-size:26px;font-weight:600;letter-spacing:-.02em;}

/* matrix */
.matrixwrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;}
.matrix{width:100%;border-collapse:collapse;}
.matrix th,.matrix td{padding:13px 16px;text-align:right;font-variant-numeric:tabular-nums;}
.matrix thead th{background:var(--surface-2);font-size:12.5px;color:var(--muted);font-weight:600;border-bottom:1px solid var(--border);text-align:center;}
.matrix .matrix-sub th{font-size:11.5px;font-weight:500;padding:8px 16px;}
.matrix .matrix-cat{text-align:left;}
.matrix tbody .matrix-cat{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14.5px;}
.matrix tbody td{border-bottom:1px solid var(--surface-3);}
.matrix tbody tr:last-child td{border-bottom:none;}
.matrix tbody td b{font-size:15px;}
.matrix-gap{border-left:1px solid var(--border);}

/* controls */
.controls{display:flex;flex-wrap:wrap;gap:16px 20px;align-items:flex-end;margin-bottom:18px;padding:16px 18px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);}
.control-group{display:flex;flex-direction:column;gap:6px;}
.control-grow{flex:1;min-width:160px;}
.control-label{font-size:11.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;font-weight:600;}
.segmented{display:inline-flex;background:var(--surface-3);border-radius:9px;padding:3px;gap:2px;}
.seg-btn{appearance:none;border:none;background:none;cursor:pointer;font-family:inherit;padding:7px 13px;border-radius:7px;color:var(--muted);transition:all .12s;font-weight:600;font-size:13px;white-space:nowrap;}
.seg-btn:hover{color:var(--text);}
.seg-on{background:var(--surface);color:var(--accent);box-shadow:0 1px 3px rgba(43,51,64,0.1);}
.search-input,.region-select{font-family:inherit;font-size:14px;padding:9px 12px;border:1px solid var(--border-strong);border-radius:8px;background:var(--surface);color:var(--text);width:100%;}
.search-input:focus,.region-select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(31,95,176,0.16);}
.region-select{cursor:pointer;min-width:160px;}

/* DC dual table */
.dc-table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;}
.dc-table{width:100%;border-collapse:collapse;}
.dc-table th{background:var(--surface-2);text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:12px 16px;border-bottom:1px solid var(--border);white-space:nowrap;position:sticky;top:0;}
.dc-table th.sortable{cursor:pointer;user-select:none;}
.dc-table th.sortable:hover{color:var(--accent);}
.th-num,.td-num{text-align:right;}
.dc-table td{padding:11px 16px;border-bottom:1px solid var(--surface-3);vertical-align:middle;}
.dc-table tbody tr:last-child td{border-bottom:none;}
.dc-table tbody tr:hover{background:var(--surface-2);}
.row-down{box-shadow:inset 3px 0 0 var(--fail);}
.row-up{box-shadow:inset 3px 0 0 var(--pass);}
.td-name{min-width:160px;}
.dc-name{display:block;font-weight:600;font-size:14px;}
.td-num.tnum b{font-size:15px;}
.empty{padding:40px;text-align:center;color:var(--muted);}
.dc-table-dual th.grp-gap,.dc-table-dual td.grp-gap{border-left:1px solid var(--border);}
.dc-grouphead th{text-align:center;border-bottom:1px solid var(--border);}
.dc-subhead th{font-weight:500;font-size:11.5px;padding-top:8px;padding-bottom:8px;}

/* DC mobile cards */
.dc-cards{display:none;flex-direction:column;gap:10px;}
.dccard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);box-shadow:var(--shadow);padding:14px 16px;}
.dccard-head{font-weight:600;font-size:15px;margin-bottom:12px;}
.dccard-modes{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.modecol{display:flex;flex-direction:column;gap:4px;padding-left:12px;border-left:2px solid var(--surface-3);}
.modecol-lab{font-size:11.5px;color:var(--muted);font-weight:500;}
.modecol-main{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
.modecol-jun{font-size:21px;font-weight:600;letter-spacing:-.02em;}
.modecol-prev{font-size:11.5px;}
.dccard-down{box-shadow:inset 3px 0 0 var(--fail),var(--shadow);}
.dccard-up{box-shadow:inset 3px 0 0 var(--pass),var(--shadow);}

/* analysis */
.stat-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px;}
.stat-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;}
.stat-box.stat-fail{border-top:3px solid var(--fail);}
.stat-box.stat-critical{border-top:3px solid var(--warn);}
.stat-box.stat-ok{border-top:3px solid var(--pass);}
.stat-num{font-size:32px;font-weight:600;letter-spacing:-.02em;line-height:1;margin-bottom:8px;}
.stat-fail .stat-num{color:var(--fail);}
.stat-critical .stat-num{color:#a8740f;}
.stat-ok .stat-num{color:var(--pass);}
.stat-lab{font-size:13px;font-weight:500;line-height:1.35;}
.rank-list{display:flex;flex-direction:column;gap:8px;}
.rankrow{display:flex;align-items:center;gap:16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:13px 18px 13px 14px;box-shadow:var(--shadow);}
.urg-critical{box-shadow:inset 4px 0 0 var(--fail),var(--shadow);}
.urg-watch{box-shadow:inset 4px 0 0 var(--warn),var(--shadow);}
.urg-ok{box-shadow:inset 4px 0 0 var(--pass),var(--shadow);}
.rank-no{font-family:var(--font-mono);font-size:16px;font-weight:600;color:var(--faint);width:26px;text-align:center;flex-shrink:0;}
.rank-dc{min-width:170px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;}
.rank-modes{display:flex;gap:22px;flex-wrap:wrap;font-size:13px;}
.rank-mode{display:inline-flex;align-items:center;gap:7px;}
.rank-mode-lab{color:var(--muted);font-size:12px;}
.rank-mode b{font-size:15px;}
.rank-bar-wrap{flex:1;display:flex;flex-direction:column;gap:7px;min-width:0;}
.rank-bar-track{height:8px;border-radius:5px;background:var(--surface-3);overflow:hidden;}
.rank-bar-fill{height:100%;border-radius:5px;}
.rank-bar-up{background:var(--pass);}
.rank-bar-down{background:var(--fail);}
.rank-bar-flat{background:var(--faint);}
.utag{font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap;}
.utag-critical{background:var(--fail-bg);color:var(--fail);}
.utag-watch{background:var(--warn-bg);color:#8a6109;}
.utag-ok{background:var(--pass-bg);color:var(--pass);}
.action-note{margin-top:24px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);padding:20px 24px;}
.action-note-title{font-weight:600;font-size:15px;margin-bottom:12px;}
.action-list{margin:0;padding-left:20px;font-size:13.5px;line-height:1.7;}
.action-list li{margin-bottom:6px;}

/* loading / error */
.center-state{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:320px;gap:16px;color:var(--muted);}
.spinner{width:36px;height:36px;border:3px solid var(--surface-3);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;}
.error-box{background:var(--fail-bg);border:1px solid #f5c0bc;border-radius:var(--radius);padding:20px 24px;max-width:560px;}
.error-title{font-weight:600;color:var(--fail);margin-bottom:8px;}
.error-msg{font-size:13.5px;color:var(--text);line-height:1.6;}
.error-msg code{font-family:var(--font-mono);font-size:12px;background:rgba(210,59,52,.1);padding:2px 5px;border-radius:4px;}
.config-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:28px 32px;max-width:540px;text-align:center;}
.config-title{font-weight:600;font-size:18px;margin-bottom:10px;}
.config-desc{font-size:14px;color:var(--muted);line-height:1.6;margin-bottom:20px;}
.config-code{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:12px 16px;font-family:var(--font-mono);font-size:12.5px;text-align:left;word-break:break-all;color:var(--text);}

.footer{text-align:center;padding:22px;color:var(--faint);font-size:12px;border-top:1px solid var(--border);}

/* tweaks panel */
.twk-panel{position:fixed;right:16px;bottom:16px;z-index:2147483646;width:280px;
  max-height:calc(100vh - 32px);display:flex;flex-direction:column;
  background:rgba(250,249,247,.78);color:#29261b;
  -webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);
  border:.5px solid rgba(255,255,255,.6);border-radius:14px;
  box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 12px 40px rgba(0,0,0,.18);
  font:11.5px/1.4 ui-sans-serif,system-ui,-apple-system,sans-serif;overflow:hidden}
.twk-hd{display:flex;align-items:center;justify-content:space-between;padding:10px 8px 10px 14px;cursor:move;user-select:none}
.twk-hd b{font-size:12px;font-weight:600;}
.twk-x{appearance:none;border:0;background:transparent;color:rgba(41,38,27,.55);width:22px;height:22px;border-radius:6px;cursor:default;font-size:13px;line-height:1}
.twk-x:hover{background:rgba(0,0,0,.06);color:#29261b}
.twk-body{padding:2px 14px 14px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;min-height:0;scrollbar-width:thin}
.twk-row{display:flex;flex-direction:column;gap:5px}
.twk-lbl{display:flex;justify-content:space-between;align-items:baseline;color:rgba(41,38,27,.72)}
.twk-lbl>span:first-child{font-weight:500}
.twk-sect{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:rgba(41,38,27,.45);padding:10px 0 0}
.twk-sect:first-child{padding-top:0}
.twk-seg{position:relative;display:flex;padding:2px;border-radius:8px;background:rgba(0,0,0,.06);user-select:none}
.twk-seg-thumb{position:absolute;top:2px;bottom:2px;border-radius:6px;background:rgba(255,255,255,.9);box-shadow:0 1px 2px rgba(0,0,0,.12);transition:left .15s,width .15s}
.twk-seg.dragging .twk-seg-thumb{transition:none}
.twk-seg button{appearance:none;position:relative;z-index:1;flex:1;border:0;background:transparent;color:inherit;font:inherit;font-weight:500;min-height:22px;border-radius:6px;cursor:default;padding:4px 6px;line-height:1.2;overflow-wrap:anywhere}
.twk-chips{display:flex;gap:6px}
.twk-chip{position:relative;appearance:none;flex:1;min-width:0;height:46px;padding:0;border:0;border-radius:6px;overflow:hidden;cursor:default;box-shadow:0 0 0 .5px rgba(0,0,0,.12),0 1px 2px rgba(0,0,0,.06);transition:transform .12s,box-shadow .12s}
.twk-chip:hover{transform:translateY(-1px);box-shadow:0 0 0 .5px rgba(0,0,0,.18),0 4px 10px rgba(0,0,0,.12)}
.twk-chip[data-on="1"]{box-shadow:0 0 0 1.5px rgba(0,0,0,.85),0 2px 6px rgba(0,0,0,.15)}
.twk-chip svg{position:absolute;top:6px;left:6px;width:13px;height:13px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.3))}

/* bar chart section */
.barchart-section{margin-top:28px;}
.subsec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
.subsec-title{font-size:15px;font-weight:600;}
.barchart-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
.bccard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;}
.bccard-head{display:flex;align-items:center;gap:10px;padding:13px 18px;border-bottom:1px solid var(--border);}
.bccard-title{font-weight:600;font-size:14.5px;}
.bccard-body{padding:14px 18px;display:flex;flex-direction:column;gap:12px;}
.bcmode{display:flex;flex-direction:column;gap:7px;}
.bcmode-label{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;}
.bcbar-row{display:flex;align-items:center;gap:8px;}
.bcbar-month{font-size:11.5px;color:var(--faint);width:26px;text-align:right;flex-shrink:0;}
.bcbar-track{flex:1;height:10px;border-radius:5px;background:var(--surface-3);overflow:hidden;}
.bcbar-fill{height:100%;border-radius:5px;transition:width .4s;}
.bcbar-fill-may{background:var(--border-strong);opacity:.55;}

<script type="text/babel">
// ─── Helpers ─────────────────────────────────────────────────────────────────

const fmt1 = (x) => (x == null || isNaN(x) ? "–" : x.toFixed(1));
const fmtDelta = (x) => `${x > 0 ? "+" : x < 0 ? "−" : "±"}${Math.abs(x).toFixed(1)}`;

function trendOf(may, jun) {
  const d = jun - may;
  return d > 0.05 ? "up" : d < -0.05 ? "down" : "flat";
}
const URG = { down: { key: "critical", label: "เร่งด่วน" }, flat: { key: "watch", label: "เฝ้าระวัง" }, up: { key: "ok", label: "กำลังฟื้นตัว" } };

function Delta({ may, jun, size = "md" }) {
  const d = jun - may;
  const dir = d > 0.04 ? "up" : d < -0.04 ? "down" : "flat";
  const arrow = dir === "up" ? "▲" : dir === "down" ? "▼" : "—";
  return <span className={`delta delta-${dir} delta-${size}`}><span className="delta-arrow">{arrow}</span><span>{fmtDelta(d)}</span></span>;
}

function PrevRef({ may }) {
  return <div className="prevref muted">พ.ค. <span className="tnum">{fmt1(may)}%</span></div>;
}

function CatIcon({ cat }) {
  if (cat === "cold") return <span className="catmark catmark-cold">❄</span>;
  if (cat === "general") return <span className="catmark catmark-general">◧</span>;
  return <span className="catmark catmark-total">◆</span>;
}

// ─── Google Sheets loader ─────────────────────────────────────────────────────

function extractSheetId(url) {
  const m = String(url).match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
  return m ? m[1] : null;
}

function parseCSV(text) {
  const rows = [];
  let cur = '';
  let inQ = false;
  const chars = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  for (let i = 0; i < chars.length; i++) {
    const c = chars[i];
    if (c === '"') {
      if (inQ && chars[i + 1] === '"') { cur += '"'; i++; }
      else inQ = !inQ;
    } else if (c === '\n' && !inQ) {
      rows.push(splitCSVRow(cur));
      cur = '';
    } else {
      cur += c;
    }
  }
  if (cur) rows.push(splitCSVRow(cur));
  return rows;
}

function splitCSVRow(line) {
  const cells = [];
  let cur = '';
  let inQ = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"') {
      if (inQ && line[i + 1] === '"') { cur += '"'; i++; }
      else inQ = !inQ;
    } else if (c === ',' && !inQ) {
      cells.push(cur.trim());
      cur = '';
    } else {
      cur += c;
    }
  }
  cells.push(cur.trim());
  return cells;
}

function toPercent(s) {
  const n = parseFloat(String(s).replace(/[,\s%]/g, ''));
  if (isNaN(n)) return null;
  // Values can be 0-1 decimals or already percentages (>1)
  const pct = n <= 1 ? n * 100 : n;
  return Math.round(pct * 10) / 10;
}

function parseSheetRows(csvText) {
  const rows = parseCSV(csvText);

  // Find Grand Total in summary section (rows 3–6)
  let grandTotal = null;
  for (let i = 2; i < Math.min(8, rows.length); i++) {
    if (rows[i] && rows[i][1] && rows[i][1].includes('Grand Total')) {
      grandTotal = {
        all: { may: toPercent(rows[i][2]), jun: toPercent(rows[i][4]) },
        exCust: { may: toPercent(rows[i][3]), jun: toPercent(rows[i][5]) },
      };
      break;
    }
  }

  // Find DC section start (after row with "DC" in col 1)
  let dcStart = -1;
  for (let i = 0; i < rows.length; i++) {
    const cell = rows[i][1];
    if (cell === 'DC' || cell === '"DC"') { dcStart = i + 2; break; }
  }

  const dcs = [];
  if (dcStart > 0) {
    for (let i = dcStart; i < rows.length; i++) {
      const r = rows[i];
      const name = r[1];
      if (!name || name.includes('Grand Total')) continue;
      const mayAll = toPercent(r[2]);
      const mayEx = toPercent(r[3]);
      const junAll = toPercent(r[4]);
      const junEx = toPercent(r[5]);
      if (mayAll == null || junAll == null) continue;
      dcs.push({ name, all: { may: mayAll, jun: junAll }, exCust: { may: mayEx ?? mayAll, jun: junEx ?? junAll } });
    }
  }

  return { grandTotal, dcs };
}

async function fetchSheet(sheetId, sheetName) {
  const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheetName)}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`HTTP ${res.status} — ${sheetName}`);
  return res.text();
}

// Province → region mapping
const PROVINCE_REGION = {
  'CDC บางนา':'bkk','DC รังสิต':'bkk','DC พุทธมณฑลสาย 3':'bkk',
  'DC นครปฐม':'central','DC สมุทรสาคร':'west','DC สระบุรี':'central',
  'DC ราชบุรี':'west','DC ลพบุรี':'central','DC อยุธยา':'central',
  'DC ชะอำ':'west','DC ชัยนาท':'north','DC สุพรรณบุรี':'central',
  'DC ลพบุรี':'central','DC พัทยา':'east','DC ชลบุรี':'east',
  'DC ระยอง':'east','DC ฉะเชิงเทรา':'east','DC ปราจีนบุรี':'east',
  'DC จันทบุรี':'east','DC ปากช่อง':'east',
  'DC กาญจนบุรี':'west',

  'DC พิจิตร':'north','DC เพชรบูรณ์':'north',
  'DC โคราช':'northeast','DC ขอนแก่น':'northeast','DC อุดรธานี':'northeast',
  'DC อุบลราชธานี':'northeast','DC บุรีรัมย์':'northeast','DC ร้อยเอ็ด':'northeast',
  'DC สุรินทร์':'northeast','DC ศรีสะเกษ':'northeast','DC ชัยภูมิ':'northeast',
  'DC สกลนคร':'northeast','DC หนองคาย':'northeast','DC ยโสธร':'northeast',
  'DC กาฬสินธุ์':'northeast','DC มุกดาหาร':'northeast','DC นครพนม':'northeast',
  'DC หาดใหญ่':'south','DC สุราษฎร์':'south','DC ภูเก็ต':'south',
  'DC นครศรีธรรมราช':'south','DC กระบี่':'south','DC ชุมพร':'south',
  'DC พัทลุง':'south','DC ทุ่งสง':'south','DC พังงา':'south',
};

const REGIONS_LIST = [
  { key: 'bkk', th: 'กรุงเทพและปริมณฑล' },
  { key: 'central', th: 'ภาคกลาง' },
  { key: 'north', th: 'ภาคเหนือ' },
  { key: 'northeast', th: 'ภาคอีสาน' },
  { key: 'east', th: 'ภาคตะวันออก' },
  { key: 'west', th: 'ภาคตะวันตก' },
  { key: 'south', th: 'ภาคใต้' },
];

async function loadSLAData(sheetId) {
  const [abCSV, ccCSV, totCSV] = await Promise.all([
    fetchSheet(sheetId, 'AB'),
    fetchSheet(sheetId, 'CC'),
    fetchSheet(sheetId, 'AB+CC'),
  ]);

  const ab = parseSheetRows(abCSV);
  const cc = parseSheetRows(ccCSV);
  const tot = parseSheetRows(totCSV);

  // Build DC map keyed by name
  const dcMap = {};
  const ensureDC = (name) => { if (!dcMap[name]) dcMap[name] = { name }; };
  ab.dcs.forEach((d) => { ensureDC(d.name); dcMap[d.name].general = { all: d.all, exCust: d.exCust }; });
  cc.dcs.forEach((d) => { ensureDC(d.name); dcMap[d.name].cold = { all: d.all, exCust: d.exCust }; });
  tot.dcs.forEach((d) => { ensureDC(d.name); dcMap[d.name].total = { all: d.all, exCust: d.exCust }; });

  const dcs = Object.values(dcMap)
    .filter((d) => d.total)
    .map((d, i) => ({
      code: `DC-${String(i + 1).padStart(3, '0')}`,
      name: d.name,
      region: PROVINCE_REGION[d.name] || 'other',
      regionTh: REGIONS_LIST.find((r) => r.key === (PROVINCE_REGION[d.name] || 'other'))?.th || 'อื่นๆ',
      total: d.total,
      general: d.general || d.total,
      cold: d.cold || d.total,
    }));

  const overview = {
    total: tot.grandTotal,
    general: ab.grandTotal,
    cold: cc.grandTotal,
  };

  return { dcs, overview, loadedAt: new Date(), dataDate: readDataDate(totCSV) };
}

function readDataDate(csvText) {
  const rows = parseCSV(csvText);
  if (!rows.length) return null;
  // Scan first 3 rows for a cell containing Thai date keywords
  for (let i = 0; i < Math.min(3, rows.length); i++) {
    for (let j = 0; j < rows[i].length; j++) {
      const cell = rows[i][j];
      if (cell && (cell.includes('ณ') || cell.includes('มิ.ย') || cell.includes('มิถุนายน') || cell.includes('as of') || cell.includes('As of'))) {
        return cell.trim();
      }
    }
  }
  return null;
}

// ─── Tweaks panel ─────────────────────────────────────────────────────────────

function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  const setTweak = React.useCallback((key, val) => {
    setValues((prev) => ({ ...prev, [key]: val }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [key]: val } }, '*');
  }, []);
  return [values, setTweak];
}

function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });

  const clamp = React.useCallback(() => {
    const p = dragRef.current; if (!p) return;
    const PAD = 16;
    offsetRef.current = {
      x: Math.min(Math.max(PAD, window.innerWidth - p.offsetWidth - PAD), Math.max(PAD, offsetRef.current.x)),
      y: Math.min(Math.max(PAD, window.innerHeight - p.offsetHeight - PAD), Math.max(PAD, offsetRef.current.y)),
    };
    p.style.right = offsetRef.current.x + 'px';
    p.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clamp();
    const ro = new ResizeObserver(clamp);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clamp]);

  React.useEffect(() => {
    const onMsg = (e) => {
      if (e?.data?.type === '__activate_edit_mode') setOpen(true);
      if (e?.data?.type === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => { setOpen(false); window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*'); };

  const onDragStart = (e) => {
    const p = dragRef.current; if (!p) return;
    const r = p.getBoundingClientRect();
    const startR = window.innerWidth - r.right, startB = window.innerHeight - r.bottom;
    const sx = e.clientX, sy = e.clientY;
    const move = (ev) => { offsetRef.current = { x: startR - (ev.clientX - sx), y: startB - (ev.clientY - sy) }; clamp(); };
    const up = () => { window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', up); };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <div ref={dragRef} className="twk-panel" style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
      <div className="twk-hd" onMouseDown={onDragStart}>
        <b>{title}</b>
        <button className="twk-x" onMouseDown={(e) => e.stopPropagation()} onClick={dismiss}>✕</button>
      </div>
      <div className="twk-body">{children}</div>
    </div>
  );
}

function TweakSection({ label }) { return <div className="twk-sect">{label}</div>; }
function TweakRow({ label, children }) { return <div className="twk-row"><div className="twk-lbl"><span>{label}</span></div>{children}</div>; }

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const valueRef = React.useRef(value); valueRef.current = value;
  const opts = options.map((o) => typeof o === 'object' ? o : { value: o, label: o });
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;
  const segAt = (cx) => {
    const r = trackRef.current.getBoundingClientRect();
    const i = Math.floor(((cx - r.left - 2) / (r.width - 4)) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };
  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX); if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => { if (!trackRef.current) return; const v = segAt(ev.clientX); if (v !== valueRef.current) onChange(v); };
    const up = () => { setDragging(false); window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); };
    window.addEventListener('pointermove', move); window.addEventListener('pointerup', up);
  };
  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown} className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb" style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`, width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>{o.label}</button>)}
      </div>
    </TweakRow>
  );
}

function TweakColor({ label, value, options, onChange }) {
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const isLight = (hex) => {
    const h = String(hex).replace('#', '').padEnd(6, '0');
    const n = parseInt(h.slice(0, 6), 16);
    if (isNaN(n)) return true;
    return ((n >> 16) & 255) * 299 + ((n >> 8) & 255) * 587 + (n & 255) * 114 > 148000;
  };
  return (
    <TweakRow label={label}>
      <div className="twk-chips">

function BarChartSection({ overview }) {
  const CATS = [
    { key: 'total', label: 'SLA รวม' },

    { key: 'cold', label: 'Cold Chain' },

  const minVal = allVals.length ? Math.max(0, Math.min(...allVals) - 4) : 0;
  const pct = (v) => v == null ? 0 : Math.max(2, Math.min(100, (v - minVal) / (100 - minVal) * 100));

  return (
    <div className="barchart-section">

                        <div className="bcbar-row">
                          <span className="bcbar-month">มิ.ย.</span>

                      </div>

function BkkRegionSection({ dcs }) {
  const [cat, setCat] = React.useState('total');

  const groups = React.useMemo(() => {
    const bkkDCs = dcs.filter(d => d.region === 'bkk');
    const regDCs = dcs.filter(d => d.region !== 'bkk' && d.region !== 'other');
    const avgMode = (list, mode) => {
      const mayVals = list.map(d => d[cat][mode].may).filter(v => v != null);
      const junVals = list.map(d => d[cat][mode].jun).filter(v => v != null);
      return {
        may: mayVals.length ? Math.round(mayVals.reduce((s, v) => s + v, 0) / mayVals.length * 10) / 10 : null,
        jun: junVals.length ? Math.round(junVals.reduce((s, v) => s + v, 0) / junVals.length * 10) / 10 : null,
      };
    };
    return {
      bkk: { count: bkkDCs.length, label: 'กรุงเทพและปริมณฑล', all: avgMode(bkkDCs, 'all'), exCust: avgMode(bkkDCs, 'exCust') },
      reg: { count: regDCs.length, label: 'ภูมิภาค', all: avgMode(regDCs, 'all'), exCust: avgMode(regDCs, 'exCust') },

  return (

      <div className="subsec-head">

                    <div className="bkkrow-data">

function ByDC({ dcs }) {
  const [cat, setCat] = React.useState("total");
  const [region, setRegion] = React.useState("all");
  const [q, setQ] = React.useState("");
  const [sort, setSort] = React.useState({ key: "allJun", dir: "asc" });

  const rows = React.useMemo(() => {
    let list = dcs.map((dc) => {
      const a = dc[cat].all, e = dc[cat].exCust;
      return { dc, all: { may: a.may, jun: a.jun, trend: trendOf(a.may, a.jun) }, ex: { may: e.may, jun: e.jun } };
    });
    if (region !== "all") list = list.filter((r) => r.dc.region === region);
    if (q.trim()) { const s = q.toLowerCase(); list = list.filter((r) => r.dc.name.toLowerCase().includes(s) || (r.dc.regionTh || '').includes(s)); }
    const dir = sort.dir === "asc" ? 1 : -1;
    list.sort((a, b) => {
      if (sort.key === "name") return a.dc.name < b.dc.name ? -dir : dir;
      const av = sort.key === "exJun" ? a.ex.jun : a.all.jun;
      const bv = sort.key === "exJun" ? b.ex.jun : b.all.jun;
      return (av - bv) * dir;
    });
    return list;
  }, [cat, region, q, sort, dcs]);

  const setSortKey = (key) => setSort((s) => s.key === key ? { key, dir: s.dir === "asc" ? "desc" : "asc" } : { key, dir: "asc" });
  const arr = (key) => sort.key === key ? (sort.dir === "asc" ? " ↑" : " ↓") : "";
  const counts = React.useMemo(() => { const c = {up:0,down:0,flat:0}; rows.forEach((r) => c[r.all.trend]++); return c; }, [rows]);

  return (
    <div>
      <div className="section-head">
        <div>
          <h2 className="section-title">SLA ราย DC</h2>
          <p className="section-desc">{dcs.length} ศูนย์กระจายสินค้า · แสดงทั้งทุกสาเหตุและตัดสาเหตุลูกค้า เทียบ พ.ค. → มิ.ย.</p>
        </div>
        <div className="trend-legend">
          <span className="legend-item"><span className="dot dot-up" />{counts.up} ดีขึ้น</span>
          <span className="legend-item"><span className="dot dot-down" />{counts.down} ลดลง</span>
          <span className="legend-item"><span className="dot dot-flat" />{counts.flat} คงที่</span>
        </div>
      </div>

      <div className="controls">
        <div className="control-group">
          <label className="control-label">หมวดสินค้า</label>
          <Segmented value={cat} onChange={setCat} options={[{key:"total",label:"รวม"},{key:"general",label:"ทั่วไป"},{key:"cold",label:"Cold Chain"}]} />
        </div>
        <div className="control-group control-grow">
          <label className="control-label">ค้นหา DC</label>
          <input className="search-input" placeholder="ชื่อ DC, จังหวัด, ภูมิภาค…" value={q} onChange={(e) => setQ(e.target.value)} />
        </div>
        <div className="control-group">
          <label className="control-label">ภูมิภาค</label>
          <select className="region-select" value={region} onChange={(e) => setRegion(e.target.value)}>
            <option value="all">ทุกภูมิภาค</option>
            {REGIONS_LIST.map((r) => <option key={r.key} value={r.key}>{r.th}</option>)}
          </select>
        </div>
      </div>

      <div className="dc-table-wrap">
        <table className="dc-table dc-table-dual">
          <thead>
            <tr className="dc-grouphead">
              <th rowSpan="2" className="sortable" style={{textAlign:'left'}} onClick={() => setSortKey("name")}>DC{arr("name")}</th>
              <th colSpan="3">ทุกสาเหตุ</th>
              <th colSpan="3" className="grp-gap">ตัดสาเหตุลูกค้า</th>
            </tr>
            <tr className="dc-subhead">
              <th className="th-num">พ.ค.</th>
              <th className="th-num sortable" onClick={() => setSortKey("allJun")}>มิ.ย.{arr("allJun")}</th>
              <th className="th-num">เปลี่ยนแปลง</th>
              <th className="th-num grp-gap">พ.ค.</th>
              <th className="th-num sortable" onClick={() => setSortKey("exJun")}>มิ.ย.{arr("exJun")}</th>
              <th className="th-num">เปลี่ยนแปลง</th>
            </tr>
          </thead>
          <tbody>
            {rows.map((r) => (
              <tr key={r.dc.code} className={`row-${r.all.trend}`}>
                <td className="td-name"><span className="dc-name">{r.dc.name}</span></td>
                <td className="td-num tnum muted">{fmt1(r.all.may)}</td>
                <td className="td-num tnum"><b>{fmt1(r.all.jun)}</b></td>
                <td className="td-num"><Delta may={r.all.may} jun={r.all.jun} size="sm" /></td>
                <td className="td-num tnum muted grp-gap">{fmt1(r.ex.may)}</td>
                <td className="td-num tnum"><b>{fmt1(r.ex.jun)}</b></td>
                <td className="td-num"><Delta may={r.ex.may} jun={r.ex.jun} size="sm" /></td>
              </tr>
            ))}
          </tbody>
        </table>
        {rows.length === 0 && <div className="empty">ไม่พบ DC ที่ตรงกับเงื่อนไข</div>}
      </div>

      <div className="dc-cards">
        {rows.map((r) => (
          <div key={r.dc.code} className={`dccard dccard-${r.all.trend}`}>
            <div className="dccard-head">{r.dc.name}</div>
            <div className="dccard-modes">
              <div className="modecol">
                <span className="modecol-lab">ทุกสาเหตุ</span>
                <div className="modecol-main"><span className="tnum modecol-jun">{fmt1(r.all.jun)}%</span><Delta may={r.all.may} jun={r.all.jun} size="sm" /></div>
                <span className="modecol-prev muted tnum">พ.ค. {fmt1(r.all.may)}%</span>
              </div>
              <div className="modecol">
                <span className="modecol-lab">ตัดสาเหตุลูกค้า</span>
                <div className="modecol-main"><span className="tnum modecol-jun">{fmt1(r.ex.jun)}%</span><Delta may={r.ex.may} jun={r.ex.jun} size="sm" /></div>
                <span className="modecol-prev muted tnum">พ.ค. {fmt1(r.ex.may)}%</span>
              </div>
            </div>
          </div>
        ))}
        {rows.length === 0 && <div className="empty">ไม่พบ DC ที่ตรงกับเงื่อนไข</div>}
      </div>
    </div>
  );
}

function Top5Section({ dcs, cat }) {
  const top5 = React.useMemo(() => {
    return [...dcs]
      .filter(dc => dc[cat] && dc[cat].all.jun != null)
      .map(dc => ({
        dc,
        jun: dc[cat].all.jun,
        may: dc[cat].all.may,
        exJun: dc[cat].exCust.jun,
        trend: trendOf(dc[cat].all.may, dc[cat].all.jun),
      }))
      .sort((a, b) => b.jun - a.jun)
      .slice(0, 5);
  }, [dcs, cat]);

  if (!top5.length) return null;
  const minBar = Math.min(95, ...top5.map(r => r.jun)) - 1;

  return (
    <div className="top5-section">
      <div className="subsec-head">
        <span className="subsec-title">5 อันดับ DC ที่ SLA ดีที่สุด</span>
        <span className="muted" style={{fontSize:12}}>ทุกสาเหตุ มิ.ย.</span>
      </div>
      <div className="top5-list">
        {top5.map((r, i) => (
          <div key={r.dc.code} className="top5row">
            <div className={`top5-medal medal-${i < 3 ? i + 1 : 'n'}`}>
              {i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : i + 1}

            <div className="top5-bar-area">
              <div className="rank-bar-track">

              </div>

                <span className="tnum top5-jun">{fmt1(r.jun)}%</span>
                <Delta may={r.may} jun={r.jun} size="sm" />

  );
}

function Analysis({ dcs }) {
  const [cat, setCat] = React.useState("total");
  const [topN, setTopN] = React.useState(10);

  const all = React.useMemo(() => {
    return dcs.map((dc) => {
      const a = dc[cat].all, e = dc[cat].exCust;
      const delta = +(a.jun - a.may).toFixed(1);
      const trend = trendOf(a.may, a.jun);
      return { dc, delta, trend, urgency: URG[trend].key, all: { may: a.may, jun: a.jun }, ex: { may: e.may, jun: e.jun } };
    }).sort((x, y) => x.all.jun - y.all.jun);
  }, [cat, dcs]);

  const ranked = topN >= 9999 ? all : all.slice(0, topN);
  const minVal = all.length ? Math.min(79, ...all.map((r) => r.all.jun)) - 1 : 79;

  return (
    <div>
      <div className="section-head">
        <div>
          <h2 className="section-title">วิเคราะห์ &amp; จัดลำดับความเร่งด่วน</h2>
          <p className="section-desc">DC ที่มี SLA เดือนมิถุนายน (ทุกสาเหตุ) ต่ำสุด เรียงจากน้อยไปมาก — เน้น DC ที่ค่าลดลงจากเดือน พ.ค.</p>
        </div>
      </div>

      <div className="controls" style={{marginBottom:18}}>
        <div className="control-group">
          <label className="control-label">หมวดสินค้า</label>
          <Segmented value={cat} onChange={setCat} options={[{key:"total",label:"รวม"},{key:"general",label:"ทั่วไป"},{key:"cold",label:"Cold Chain"}]} />
        </div>
        <div className="control-group">
          <label className="control-label">แสดง</label>
          <Segmented value={String(topN)} onChange={(v) => setTopN(+v)} options={[{key:"10",label:"10 อันดับ"},{key:"20",label:"20 อันดับ"},{key:"9999",label:"ทั้งหมด"}]} />
        </div>
      </div>

      <div className="rank-list">
        {ranked.map((r, i) => (
          <div key={r.dc.code} className={`rankrow urg-${r.urgency}`}>
            <div className="rank-no">{i + 1}</div>
            <div className="rank-dc">
              <span className="dc-name">{r.dc.name}</span>
              <span className={`utag utag-${r.urgency}`}>{URG[r.trend].label}</span>
            </div>
            <div className="rank-bar-wrap">
              <div className="rank-bar-track">
                <div className={`rank-bar-fill rank-bar-${r.trend}`} style={{ width: Math.max(3, Math.min(100, (r.all.jun - minVal) / (100 - minVal) * 100)) + "%" }} />
              </div>
              <div className="rank-modes">
                <span className="rank-mode"><span className="rank-mode-lab">ทุกสาเหตุ</span><b className="tnum">{fmt1(r.all.jun)}%</b><Delta may={r.all.may} jun={r.all.jun} size="sm" /></span>
                <span className="rank-mode"><span className="rank-mode-lab">ตัดสาเหตุลูกค้า</span><b className="tnum">{fmt1(r.ex.jun)}%</b><Delta may={r.ex.may} jun={r.ex.jun} size="sm" /></span>
              </div>
            </div>
          </div>
        ))}
      </div>

      <div className="action-note">
        <div className="action-note-title">ข้อเสนอแนะการจัดการ</div>
        <ul className="action-list">
          <li><b className="status-text-fail">เร่งด่วน</b> — DC ที่ SLA เดือน มิ.ย. ต่ำและลดลงจากเดือน พ.ค. ควรตั้งทีมเร่งแก้ไขและทบทวนสาเหตุรายสัปดาห์</li>
          <li><b className="status-text-warn">เฝ้าระวัง</b> — DC ที่ค่าทรงตัว ติดตามต่อเนื่องไม่ให้ปรับลดลง</li>
          <li>เทียบ <b>ทุกสาเหตุ</b> กับ <b>ตัดสาเหตุลูกค้า</b> เพื่อแยกว่าปัญหามาจากกระบวนการภายในหรือจากฝั่งลูกค้า</li>
        </ul>
      </div>
    </div>
  );
}

// ─── Region tab ───────────────────────────────────────────────────────────────

function RegionTab({ dcs }) {
  const [cat, setCat] = React.useState('total');
  const [expanded, setExpanded] = React.useState(null);

  const regions = React.useMemo(() => {
    return REGIONS_LIST.map(reg => {
      const regDCs = dcs.filter(d => d.region === reg.key);
      if (!regDCs.length) return null;
      const avg = (mode, month) => {
        const vals = regDCs.map(d => d[cat][mode][month]).filter(v => v != null);
        return vals.length ? Math.round(vals.reduce((s, v) => s + v, 0) / vals.length * 10) / 10 : null;
      };
      const allJun = avg('all', 'jun');
      const allMay = avg('all', 'may');
      const exJun = avg('exCust', 'jun');
      const exMay = avg('exCust', 'may');
      const trend = trendOf(allMay, allJun);
      const urgency = URG[trend].key;
      const dcsSorted = [...regDCs].sort((a, b) => a[cat].all.jun - b[cat].all.jun);
      return { key: reg.key, label: reg.th, count: regDCs.length, allJun, allMay, exJun, exMay, trend, urgency, dcs: dcsSorted };
    }).filter(Boolean).sort((a, b) => a.allJun - b.allJun);
  }, [dcs, cat]);

  const minBar = regions.length ? Math.max(0, Math.min(...regions.map(r => r.allJun)) - 4) : 0;
  const pct = (v) => v == null ? 0 : Math.max(3, Math.min(100, (v - minBar) / (100 - minBar) * 100));

  const toggleExpand = (key) => setExpanded(prev => prev === key ? null : key);

  return (
    <div>
      <div className="section-head">
        <div>
          <h2 className="section-title">SLA รายภูมิภาค</h2>
          <p className="section-desc">เปรียบเทียบ SLA เฉลี่ยแต่ละภูมิภาค เดือนมิถุนายน เรียงจากต่ำไปสูง</p>
        </div>
      </div>

      <div className="controls" style={{marginBottom:18}}>
        <div className="control-group">
          <label className="control-label">หมวดสินค้า</label>
          <Segmented value={cat} onChange={setCat} options={[
            {key:'total',label:'รวม'},{key:'general',label:'ทั่วไป'},{key:'cold',label:'Cold Chain'}
          ]} />
        </div>
      </div>

      <div className="region-list">
        {regions.map(r => (
          <div key={r.key} className="region-block">
            <div className={`region-row urg-${r.urgency}`} onClick={() => toggleExpand(r.key)} style={{cursor:'pointer'}}>
              <div className="region-info">
                <span className="region-name">{r.label}</span>
                <span className="region-cnt">{r.count} DC</span>
                <span className={`utag utag-${r.urgency}`}>{URG[r.trend].label}</span>
              </div>
              <div className="region-bar-area">
                <div className="rank-bar-track">
                  <div className={`rank-bar-fill rank-bar-${r.trend}`} style={{width: pct(r.allJun) + '%'}} />
                </div>
                <div className="region-metrics">
                  <span className="region-mode-group">
                    <span className="rank-mode-lab">ทุกสาเหตุ</span>
                    <b className="tnum">{fmt1(r.allJun)}%</b>
                    <Delta may={r.allMay} jun={r.allJun} size="sm" />
                  </span>
                  <span className="region-mode-group">
                    <span className="rank-mode-lab">ตัดสาเหตุลูกค้า</span>
                    <b className="tnum">{fmt1(r.exJun)}%</b>
                    <Delta may={r.exMay} jun={r.exJun} size="sm" />
                  </span>
                </div>
              </div>
              <div className="region-chevron">{expanded === r.key ? '▲' : '▼'}</div>
            </div>

            {expanded === r.key && (
              <div className="region-dcs">
                {r.dcs.map((dc, i) => {
                  const a = dc[cat].all, e = dc[cat].exCust;
                  const t = trendOf(a.may, a.jun);
                  return (
                    <div key={dc.code} className={`region-dc-row row-${t}`}>
                      <span className="region-dc-no">{i + 1}</span>
                      <span className="region-dc-name">{dc.name}</span>
                      <span className="region-dc-vals">
                        <span className="rank-mode-lab">ทุกสาเหตุ</span>
                        <b className="tnum">{fmt1(a.jun)}%</b>
                        <Delta may={a.may} jun={a.jun} size="sm" />
                        <span className="rank-mode-lab" style={{marginLeft:10}}>ตัดลูกค้า</span>
                        <b className="tnum">{fmt1(e.jun)}%</b>
                      </span>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        ))}
      </div>
    </div>
  );
}

// ─── Top Rank tab ─────────────────────────────────────────────────────────────

function TopRank({ dcs }) {
  const [cat, setCat] = React.useState("total");

  const top10 = React.useMemo(() => {
    return [...dcs]
      .filter(dc => dc[cat] && dc[cat].all.jun != null)
      .map(dc => ({
        dc,
        jun: dc[cat].all.jun,
        may: dc[cat].all.may,
        exJun: dc[cat].exCust.jun,
        trend: trendOf(dc[cat].all.may, dc[cat].all.jun),
      }))
      .sort((a, b) => b.jun - a.jun)
      .slice(0, 10);
  }, [dcs, cat]);

  const minBar = top10.length ? Math.min(95, ...top10.map(r => r.jun)) - 1 : 90;

  return (
    <div>
      <div className="section-head">
        <div>
          <h2 className="section-title">10 อันดับ DC ที่ SLA ดีที่สุด</h2>
          <p className="section-desc">DC ที่มี SLA ทุกสาเหตุ เดือนมิถุนายน สูงสุด เรียงจากมากไปน้อย</p>
        </div>
      </div>

      <div className="controls" style={{marginBottom:18}}>
        <div className="control-group">
          <label className="control-label">หมวดสินค้า</label>
          <Segmented value={cat} onChange={setCat} options={[
            {key:"total",label:"รวม"},{key:"general",label:"ทั่วไป"},{key:"cold",label:"Cold Chain"}
          ]} />
        </div>
      </div>

      <div className="top5-list">
        {top10.map((r, i) => (
          <div key={r.dc.code} className="top5row">
            <div className={`top5-medal medal-${i < 3 ? i + 1 : 'n'}`}>
              {i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : i + 1}
            </div>
            <div className="top5-dc-name">{r.dc.name}</div>
            <div className="top5-bar-area">
              <div className="rank-bar-track">
                <div className={`rank-bar-fill rank-bar-${r.trend}`} style={{width: Math.max(3, (r.jun - minBar) / (100 - minBar) * 100) + '%'}} />
              </div>
              <div className="top5-metrics">
                <span className="tnum top5-jun">{fmt1(r.jun)}%</span>
                <Delta may={r.may} jun={r.jun} size="sm" />
                <span className="top5-exlab">ตัดลูกค้า {fmt1(r.exJun)}%</span>
              </div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ─── App ──────────────────────────────────────────────────────────────────────

const TWEAK_DEFAULTS = { overviewLayout: "rows", accent: "#1f5fb0", density: "regular" };
const TABS = [{ key: "overview", th: "ภาพรวม" }, { key: "region", th: "ภูมิภาค" }, { key: "bydc", th: "ราย DC" }, { key: "top", th: "Top 10" }];

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [tab, setTab] = React.useState(() => { try { return localStorage.getItem("sla_tab") || "overview"; } catch { return "overview"; } });
  const [status, setStatus] = React.useState("idle"); // idle | loading | done | error
  const [slaData, setSlaData] = React.useState(null);
  const [errorMsg, setErrorMsg] = React.useState("");
  const [loadedAt, setLoadedAt] = React.useState(null);

  React.useEffect(() => { try { localStorage.setItem("sla_tab", tab); } catch {} }, [tab]);
  React.useEffect(() => { document.documentElement.style.setProperty("--accent", t.accent); document.documentElement.dataset.density = t.density; }, [t.accent, t.density]);

  const load = React.useCallback(async () => {
    const url = window.SHEET_URL;
    if (!url || !url.trim()) { setStatus("noconfig"); return; }
    const sheetId = extractSheetId(url);
    if (!sheetId) { setStatus("error"); setErrorMsg("URL ไม่ถูกต้อง — ต้องเป็น URL ของ Google Sheets"); return; }
    setStatus("loading");
    setErrorMsg("");
    try {
      const data = await loadSLAData(sheetId);
      setSlaData(data);
      setLoadedAt(data.loadedAt);
      setStatus("done");
    } catch (e) {
      setStatus("error");
      setErrorMsg(e.message || "ไม่สามารถดึงข้อมูลได้");
    }
  }, []);

  React.useEffect(() => { load(); }, [load]);

  const fmtTime = (d) => d ? d.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }) : "";

  return (
    <div className="app">
      <header className="topbar">
        <div className="topbar-inner">
          <div className="brand">
            <div className="brand-mark">SLA</div>
            <div>
              <div className="brand-title">ภาพรวม SLA</div>
              <div className="brand-sub">ศูนย์กระจายสินค้า</div>
            </div>
          </div>
          <div className="topbar-right">
            {loadedAt && <span className="last-updated">อัปเดต {fmtTime(loadedAt)}</span>}
            <button className="refresh-btn" onClick={load} disabled={status === "loading"}>
              <span className={`refresh-icon${status === "loading" ? " spinning" : ""}`}>↻</span>
              <span>รีเฟรช</span>
            </button>
            <div className="period">
              <span className="period-label">รอบเปรียบเทียบ</span>
              <span className="period-val">พ.ค. <span className="period-arrow">→</span> มิ.ย. 2569</span>
              {slaData?.dataDate && <span className="data-date">{slaData.dataDate}</span>}
            </div>
          </div>
        </div>
        <nav className="tabs">
          {TABS.map((tb) => (
            <button key={tb.key} className={`tab ${tab === tb.key ? "tab-on" : ""}`} onClick={() => setTab(tb.key)}>
              <span className="tab-th">{tb.th}</span>
            </button>
          ))}
        </nav>
      </header>

      <main className="content">
        {status === "noconfig" && (
          <div className="center-state">
            <div className="config-box">
              <div className="config-title">ตั้งค่า Google Sheets URL</div>
              <div className="config-desc">เปิดไฟล์ <code>index.html</code> แล้วแก้ไขบรรทัดนี้ให้เป็น URL ของ Google Sheets ที่แชร์แบบ "Anyone with the link can view"</div>
              <div className="config-code">window.SHEET_URL = "https://docs.google.com/spreadsheets/d/YOUR_ID_HERE/...";</div>
            </div>
          </div>
        )}
        {status === "loading" && (
          <div className="center-state">
            <div className="spinner" />
            <span>กำลังดึงข้อมูลจาก Google Sheets…</span>
          </div>
        )}
        {status === "error" && (
          <div className="center-state">
            <div className="error-box">
              <div className="error-title">ดึงข้อมูลไม่สำเร็จ</div>
              <div className="error-msg">
                {errorMsg}<br /><br />
                ตรวจสอบว่า Google Sheets ตั้งค่า sharing เป็น <b>"Anyone with the link can view"</b> และ URL ถูกต้อง
              </div>
            </div>
            <button className="refresh-btn" onClick={load}>ลองใหม่</button>
          </div>
        )}
        {status === "done" && slaData && (
          <>
            {tab === "overview" && <Overview layout={t.overviewLayout} overview={slaData.overview} dcs={slaData.dcs} />}
            {tab === "region" && <RegionTab dcs={slaData.dcs} />}
            {tab === "bydc" && <ByDC dcs={slaData.dcs} />}
            {tab === "top" && <TopRank dcs={slaData.dcs} />}
          </>
        )}
      </main>

      <footer className="footer" />

      <TweaksPanel>
        <TweakSection label="เลย์เอาต์ภาพรวม" />
        <TweakRadio label="รูปแบบ" value={t.overviewLayout}
          options={["rows","cards","split","matrix"]}
          onChange={(v) => setTweak("overviewLayout", v)} />
        <TweakSection label="ธีม" />
        <TweakColor label="สีหลัก" value={t.accent}
          options={["#1f5fb0","#0f766e","#4f46e5","#475569"]}
          onChange={(v) => setTweak("accent", v)} />
        <TweakRadio label="ความหนาแน่น" value={t.density}
          options={["compact","regular","comfy"]}
          onChange={(v) => setTweak("density", v)} />
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
